<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إنشاء حساب — Future Center</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">
 <section class="auth-card card">
  <div class="brand"><div class="brand-mark">FC</div><h1>Future <span class="gold">Center</span></h1><p>أنشئ حسابك واستكشف الكورسات قبل الاشتراك</p></div>
  <form id="form">
   <div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" autocomplete="email" required></div>
   <div class="field"><label for="password">كلمة المرور (8 أحرف على الأقل)</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required></div>
   <div class="field"><label for="confirm_password">تأكيد كلمة المرور</label><input class="input" id="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div>
   <label class="terms-option"><input type="checkbox" id="terms" required><span>أوافق على الشروط والأحكام وسياسة الخصوصية</span></label>
   <button class="btn primary btn-wide" id="submit" type="submit">إنشاء الحساب</button>
   <button type="button" class="link" onclick="location.href='index.html'">لدي حساب بالفعل — تسجيل الدخول</button>
  </form>
  <div id="msg" class="empty" style="padding:10px" aria-live="polite"></div>
 </section>
</main>
<script src="config.js"></script>
<script>
const C=FC_CONFIG,API=C.supabaseUrl.replace(/\\/$/,'');
const $=id=>document.getElementById(id);
async function auth(path,body){
 const r=await fetch(API+'/auth/v1/'+path,{method:'POST',headers:{apikey:C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'تعذر إنشاء الحساب');return j;
}
$('form').onsubmit=async e=>{
 e.preventDefault();
 const email=$('email').value.trim().toLowerCase(),password=$('password').value;
 if(password!==$('confirm_password').value){$('msg').textContent='كلمتا المرور غير متطابقتين.';return}
 const submit=$('submit');submit.disabled=true;$('msg').textContent='جاري إنشاء الحساب...';
 try{
  const j=await auth('signup',{email,password});
  if(j.access_token&&j.user){localStorage.setItem('fc_session',JSON.stringify(j));location.href='index.html';return}
  $('msg').textContent='تم إنشاء الحساب. افتح رسالة التأكيد على بريدك الإلكتروني، ثم سجّل الدخول من الصفحة الرئيسية.';
  submit.disabled=false;
 }catch(err){$('msg').textContent=String(err.message||'تعذر إنشاء الحساب');submit.disabled=false}
};
</script>
</body>
</html>
