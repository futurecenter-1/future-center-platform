<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كلمة مرور جديدة — Future Center</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-wrap"><section class="card auth-card">
<div class="auth-head"><div class="brand">FUTURE <span>CENTER</span></div>
<h1>تعيين كلمة مرور جديدة</h1><p>اختر كلمة مرور قوية لحسابك.</p></div>
<form id="form" class="form">
<div class="field"><label for="password">كلمة المرور الجديدة</label><input class="input" id="password" type="password" minlength="6" placeholder="6 أحرف أو أكثر" required autocomplete="new-password"></div>
<div class="field"><label for="confirm">تأكيد كلمة المرور</label><input class="input" id="confirm" type="password" minlength="6" placeholder="أعد كتابة كلمة المرور" required autocomplete="new-password"></div>
<button class="gold submit" type="submit">حفظ ومتابعة</button></form>
<div id="msg" class="msg"></div>
<div class="help-links"><a href="login.html">العودة لتسجيل الدخول</a></div>
<a class="back" href="index.html">← العودة إلى المنصة</a>

</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(FC_CONFIG.supabaseUrl,FC_CONFIG.supabaseKey);
const formEl=document.getElementById('form'), msgEl=document.getElementById('msg');
function msg(t,c=''){msgEl.textContent=t;msgEl.className='msg show '+c}
formEl.addEventListener('submit',async e=>{
 e.preventDefault();
 if(password.value!==confirm.value){msg('كلمتا المرور غير متطابقتين.','error');return}
 msg('جاري حفظ كلمة المرور...');
 const {error}=await sb.auth.updateUser({password:password.value});
 if(error){msg('تعذر تغيير كلمة المرور: '+error.message,'error');return}
 msg('تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.','success');
 setTimeout(()=>location.href='login.html',1600);
});
</script>

</body></html>
