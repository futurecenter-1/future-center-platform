name: Build Future Center Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-prototype
    paths:
      - 'app.js'
      - 'index.html'
      - 'login.html'
      - 'register.html'
      - 'reset.html'
      - 'student.html'
      - 'lecture.html'
      - 'admin.html'
      - 'admin/**'
      - 'styles.css'
      - 'auth.css'
      - 'config.js'
      - 'manifest.json'
      - 'icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-mobile-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: node scripts/sync-mobile-web.mjs
      - name: Generate Android project
        run: npx cap add android
      - name: Enable screenshot and recording protection
        run: node scripts/enable-android-screen-security.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: future-center-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
