<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور — Future Center</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><section class="auth-card card"><div class="brand"><div class="brand-mark">FC</div><h1>Future <span class="gold">Center</span></h1><p>استعادة كلمة المرور</p></div><form id="form"><div class="field"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" required></div><button class="btn primary btn-wide">إرسال رابط الاستعادة</button></form><div id="msg" class="empty" style="padding:12px"></div><button class="link" onclick="location.href='login.html'">العودة لتسجيل الدخول</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(FC_CONFIG.supabaseUrl,FC_CONFIG.supabaseKey);form.onsubmit=async e=>{e.preventDefault();msg.textContent='جاري الإرسال...';const{error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname.replace('reset.html','index.html')});msg.textContent=error?error.message:'تم إرسال رابط الاستعادة إلى بريدك الإلكتروني.'};</script></body></html>
