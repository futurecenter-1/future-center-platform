<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل الدخول — Future Center</title>
<link rel="stylesheet" href="../auth.css">
<style>
:root{--navy:#061728;--navy2:#0a2034;--gold:#f3b84b;--gold2:#ffd77c;--text:#f7f7f5;--muted:#c9d0d7;--line:rgba(255,255,255,.25)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#03111e;color:var(--text)}body{min-height:100svh;overflow-x:hidden}.scene{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 75% 12%,rgba(25,72,105,.65),transparent 30%),linear-gradient(145deg,#071a2c 0%,#061322 52%,#020b13 100%);overflow:hidden}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,8,15,.18),rgba(1,8,15,.45)),radial-gradient(circle at 50% 100%,rgba(243,184,75,.12),transparent 45%)}.orb{position:absolute;border-radius:50%;filter:blur(45px);opacity:.28}.orb-a{width:280px;height:280px;right:-70px;top:80px;background:#17496d}.orb-b{width:220px;height:220px;left:-70px;bottom:90px;background:#7c511d}.tower{position:absolute;right:9%;top:3%;width:115px;height:520px;opacity:.25;background:linear-gradient(90deg,transparent 0 15%,#a27b48 18% 22%,transparent 24% 36%,#a27b48 39% 43%,transparent 45% 57%,#8d673d 60% 64%,transparent 66%),linear-gradient(#24384b,#0b1a27);clip-path:polygon(38% 0,62% 0,70% 7%,74% 28%,100% 36%,91% 100%,9% 100%,0 36%,26% 28%,30% 7%)}.auth-page{width:min(430px,100%);min-height:100svh;margin:auto;padding:24px 18px 28px;display:flex;flex-direction:column;align-items:center}.brand-lockup{display:flex;align-items:center;gap:10px;margin:6px 0 18px}.brand-lockup img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(243,184,75,.25))}.brand-name{display:flex;flex-direction:column;line-height:.9;letter-spacing:3px;font-family:Georgia,serif;font-size:25px}.brand-name span{font-family:Tahoma,sans-serif;letter-spacing:7px;color:var(--gold);font-size:11px;text-align:center;margin-top:7px}.auth-panel{width:100%;padding:20px 18px 17px;border:1px solid rgba(255,255,255,.24);border-radius:30px;background:linear-gradient(135deg,rgba(46,55,64,.58),rgba(9,23,35,.68));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.12)}.back-row{display:flex;justify-content:flex-start}.back-row a{width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:32px;font-weight:300}.panel-head{text-align:center;padding:2px 0 17px}.user-badge{margin:0 auto 10px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(243,184,75,.15);border:1px solid var(--gold);color:var(--gold);font-size:30px}.panel-head h1{margin:0 0 7px;font-size:26px}.panel-head p{margin:0;color:var(--muted);font-size:14px}.field{display:block;margin:12px 0}.field>span{display:block;margin:0 4px 7px;font-weight:700;font-size:14px}.input-wrap{position:relative}.input-wrap input{width:100%;height:54px;border:1px solid rgba(255,255,255,.34);border-radius:15px;background:rgba(7,19,31,.52);color:#fff;padding:0 48px 0 42px;outline:none;font-size:15px;text-align:right}.input-wrap input::placeholder{color:#9ca7b1}.input-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,184,75,.1)}.input-wrap>b{position:absolute;right:15px;top:16px;color:var(--gold);font-size:18px}.eye{position:absolute;left:9px;top:8px;height:38px;width:38px;border:0;background:transparent;color:#fff;font-size:17px}.form-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:10px 3px 17px}.form-meta a,.new-account a{color:var(--gold2);text-decoration:none}.remember{display:flex;gap:7px;align-items:center}.remember input{accent-color:var(--gold);width:17px;height:17px}.gold-btn,.google-btn{width:100%;height:55px;border-radius:16px;font-size:17px;font-weight:800;cursor:pointer}.gold-btn{border:1px solid var(--gold2);background:linear-gradient(135deg,#d99525,#ffd36e);color:#17110a;box-shadow:0 10px 28px rgba(243,184,75,.22)}.gold-btn span{font-size:24px;margin-right:8px}.gold-btn:disabled{opacity:.65;cursor:wait}.msg{min-height:20px;text-align:center;font-size:13px;margin:10px 0}.msg.error{color:#ffb4b4}.msg.show{display:block}.divider{display:flex;align-items:center;gap:10px;color:#d2d6db;font-size:12px;margin:7px 0 12px}.divider:before,.divider:after{content:"";height:1px;background:rgba(255,255,255,.35);flex:1}.google-btn{border:1px solid rgba(255,255,255,.34);background:rgba(4,16,27,.48);color:#fff}.g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285f4;font-weight:900;margin-left:7px}.new-account{text-align:center;margin:16px 0 5px;color:#d8dde1;font-size:13px}.secure{text-align:center;margin:12px 0 0;color:#c2c9ce;font-size:11px}@media(max-width:360px){.auth-page{padding-inline:12px}.auth-panel{padding-inline:14px}.panel-head h1{font-size:23px}}

</style></head>
<body>
<div class="scene" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="tower"></div></div>
<main class="auth-page">
  <header class="brand-lockup">
    <img id="brandLogo" alt="Future Center">
    <div class="brand-name"><b>FUTURE</b><span>CENTER</span></div>
  </header>
  <section class="auth-panel">
    <div class="back-row"><a href="index.html" aria-label="العودة">‹</a></div>
    <div class="panel-head">
      <div class="user-badge" aria-hidden="true">♙</div>
      <h1>تسجيل دخول الطالب</h1>
      <p>ابدأ رحلتك التعليمية مع Future Center</p>
    </div>
    <form id="form" novalidate>
      <label class="field"><span>البريد الإلكتروني</span><div class="input-wrap"><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="أدخل البريد الإلكتروني"><b>✉</b></div></label>
      <label class="field"><span>كلمة المرور</span><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"><button type="button" class="eye" id="togglePass" aria-label="إظهار كلمة المرور">◉</button><b>⌁</b></div></label>
      <div class="form-meta"><label class="remember"><input id="remember" type="checkbox"><span>تذكرني</span></label><a href="reset.html">نسيت كلمة المرور؟</a></div>
      <button class="gold-btn" id="submit" type="submit">تسجيل الدخول <span>↩</span></button>
    </form>
    <div id="msg" class="msg" role="status"></div>
    <div class="divider"><span>أو تسجيل الدخول عبر</span></div>
    <button class="google-btn" type="button" id="googleBtn"><span class="g">G</span> تسجيل الدخول بواسطة Google</button>
    <div class="new-account">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></div>
    <p class="secure">⌾ دخول آمن ومشفر لحماية بياناتك</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

function showMsg(t,c=''){ $('msg').textContent=t; $('msg').className='msg show '+c; }
$('togglePass').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';};
$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password){showMsg('اكتب البريد الإلكتروني وكلمة المرور.','error');return;}
 $('submit').disabled=true; showMsg('جاري تسجيل الدخول...');
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){showMsg('البريد الإلكتروني أو كلمة المرور غير صحيحة.','error');$('submit').disabled=false;return;}
 const u=data.user;
 const {data:p}=await sb.from('students').select('id').eq('auth_user_id',u.id).maybeSingle();
 if(!p){await sb.from('students').upsert({id:u.id,auth_user_id:u.id,full_name:u.user_metadata?.full_name||'',phone:u.user_metadata?.phone||'',email:u.email||''},{onConflict:'id'});}
 location.href='student.html';
});
$('googleBtn').onclick=async()=>{
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error) showMsg('تعذر بدء تسجيل الدخول بواسطة Google.','error');
};
</script>
