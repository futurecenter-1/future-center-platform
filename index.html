/* iOS Safari: prevent pinch and double-tap page zoom for app-like interaction. */
(function(){
  const stopZoom = function(e){ if(e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', stopZoom, {passive:false});
  document.addEventListener('gesturechange', stopZoom, {passive:false});
  document.addEventListener('gestureend', stopZoom, {passive:false});
  document.addEventListener('touchstart', function(e){ if(e.touches && e.touches.length > 1) stopZoom(e); }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now-lastTouchEnd <= 300) stopZoom(e);
    lastTouchEnd = now;
  }, {passive:false});
})();
