<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — Future Center</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-wrap"><section class="card auth-card">
<div class="auth-head"><div class="brand">FUTURE <span>CENTER</span></div>
<h1>تسجيل دخول الطالب</h1><p>ادخل إلى حسابك للوصول إلى المواد والمحاضرات الخاصة بك.</p></div>
<form id="form" class="form">
<div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" placeholder="example@email.com" required autocomplete="email"></div>
<div class="field"><label for="password">كلمة المرور</label><input class="input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
<button class="gold submit" type="submit">حفظ ومتابعة</button></form>
<div id="msg" class="msg"></div>
<div class="help-links"><a href="register.html">إنشاء حساب جديد</a><a href="reset.html">نسيت كلمة المرور؟</a></div>
<a class="back" href="index.html">← العودة إلى المنصة</a>

</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(FC_CONFIG.supabaseUrl,FC_CONFIG.supabaseKey);
const formEl=document.getElementById('form'), msgEl=document.getElementById('msg');
function msg(t,c=''){msgEl.textContent=t;msgEl.className='msg show '+c}
formEl.addEventListener('submit',async e=>{
 e.preventDefault(); msg('جاري تسجيل الدخول...');
 const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){msg('البريد الإلكتروني أو كلمة المرور غير صحيحة.','error');return}
 const u=data.user;
 const {data:p}=await sb.from('students').select('id').eq('auth_user_id',u.id).maybeSingle();
 if(!p){
   await sb.from('students').upsert({id:u.id,auth_user_id:u.id,full_name:u.user_metadata?.full_name||'',phone:u.user_metadata?.phone||'',email:u.email||''},{onConflict:'id'});
 }
 location.href='student.html';
});
</script>

</body></html>
